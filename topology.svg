<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="339" viewBox="0 0 320 339" role="img" aria-label="Topology: Router-on-a-Stick Office">
<title>Topology: Router-on-a-Stick Office</title>
<style>
svg{color-scheme:light dark}
.bg{fill:Canvas}
.ln{stroke:CanvasText;stroke-opacity:.55;stroke-width:1.5}
.ln.down{stroke-dasharray:5 4}
.dev{fill:Canvas;stroke:CanvasText;stroke-width:1.5}
.t{fill:CanvasText;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.h{font-size:15px;font-weight:700}
.lbl{font-size:13px;font-weight:600}
.sub{font-size:10px;opacity:.65;letter-spacing:.06em}
.port{font-size:9.5px;opacity:.85;paint-order:stroke;stroke:Canvas;stroke-width:3px;stroke-linejoin:round}
</style>
<rect class="bg" fill="none" x="0" y="0" width="320" height="339"/>
<text class="t h" x="48" y="40">Router-on-a-Stick Office</text>
<line class="ln" stroke="currentColor" x1="137.0" y1="268.0" x2="114.0" y2="115.0"/>
<text class="t port" text-anchor="middle" x="130.2" y="225.5">Fa0/1</text>
<text class="t port" text-anchor="middle" x="120.8" y="163.5">Gi0/0</text>
<rect class="dev" fill="none" stroke="currentColor" rx="8" x="48.0" y="92.0" width="132" height="46"/>
<text class="t lbl" text-anchor="middle" x="114.0" y="113.0">Router-1</text>
<text class="t sub" text-anchor="middle" x="114.0" y="128.0">ROUTER</text>
<rect class="dev" fill="none" stroke="currentColor" rx="8" x="71.0" y="245.0" width="132" height="46"/>
<text class="t lbl" text-anchor="middle" x="137.0" y="266.0">Switch-1</text>
<text class="t sub" text-anchor="middle" x="137.0" y="281.0">SWITCH</text>
</svg>
